name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'installer/Clipboard_History_Setup.exe'
      - 'installer/Clipboard_History_Setup.exe.sha256'
      - 'assets/branding/**'
  workflow_dispatch:

concurrency:
  group: ots-clipboard-installer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and compile WPF application
        shell: pwsh
        run: |
          dotnet restore src/ClipboardHistory/ClipboardHistory.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build src/ClipboardHistory/ClipboardHistory.csproj --no-restore --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish src/ClipboardHistory/ClipboardHistory.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output dist/publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          if (-not (Test-Path 'dist/publish/ClipboardHistory.exe')) { throw 'Application executable missing' }

      - name: Install Inno Setup when necessary
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

      - name: Compile actual .exe installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'packaging/Clipboard_History.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          if (-not (Test-Path 'dist/setup/Clipboard_History_Setup.exe')) { throw 'Installer executable missing' }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = 'dist/setup/Clipboard_History_Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/setup/Clipboard_History_Setup.exe.sha256' -Value "$hash  Clipboard_History_Setup.exe" -Encoding ascii
          Get-Item $file | Select-Object FullName,Length
          Write-Host "SHA-256: $hash"

      - name: Independently verify installer SHA-256 before upload
        shell: pwsh
        run: |
          $file = 'dist/setup/Clipboard_History_Setup.exe'
          $checksumFile = 'dist/setup/Clipboard_History_Setup.exe.sha256'
          if (-not (Test-Path $file) -or -not (Test-Path $checksumFile)) { throw 'Installer or checksum file is missing' }
          $expectedLine = (Get-Content -LiteralPath $checksumFile -Raw).Trim()
          if ($expectedLine -notmatch '^([a-fA-F0-9]{64})\s+Clipboard_History_Setup\.exe
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard_History_Windows_Installer
          path: |
            dist/setup/Clipboard_History_Setup.exe
            dist/setup/Clipboard_History_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 1

) { throw 'Malformed installer checksum' }
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          if ($actual -ne $Matches[1]) { throw 'Installer SHA-256 mismatch' }
          if ((Get-Item $file).Length -lt 100000) { throw 'Installer is suspiciously small' }
          Write-Host 'Installer file size and checksum verified'
      - name: Upload downloadable installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard_History_Windows_Installer
          path: |
            dist/setup/Clipboard_History_Setup.exe
            dist/setup/Clipboard_History_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 1

